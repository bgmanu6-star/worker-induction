<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Induction Register</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                    <i data-lucide="hard-hat" class="w-7 h-7 text-indigo-200"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Worker Induction Register</h1>
                    <p class="text-xs text-indigo-200">Live Multi-Device Cloud Portal</p>
                </div>
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <div id="connectionStatus" class="bg-emerald-500/20 text-emerald-100 border border-emerald-400/30 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Connected Live
                </div>
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition-all shadow-sm">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Export Excel
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6">

        <!-- Stats Overview Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Workers</p>
                    <h3 id="statTotalWorkers" class="text-3xl font-extrabold text-slate-900 mt-1">0</h3>
                </div>
                <div class="bg-indigo-50 p-3 rounded-xl text-indigo-600">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Agencies</p>
                    <h3 id="statTotalAgencies" class="text-3xl font-extrabold text-slate-900 mt-1">0</h3>
                </div>
                <div class="bg-emerald-50 p-3 rounded-xl text-emerald-600">
                    <i data-lucide="building-2" class="w-6 h-6"></i>
                </div>
            </div>
        </div>

        <!-- Agency Breakdown Grid -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i data-lucide="pie-chart" class="w-4 h-4 text-indigo-600"></i> Agency-wise Worker Count
            </h3>
            <div id="agencyBreakdownList" class="flex flex-wrap gap-2">
                <span class="text-sm text-slate-400 italic">No workers registered yet.</span>
            </div>
        </div>

        <!-- Registration & Search Section Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Form Column -->
            <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                <div class="flex items-center justify-between mb-5 pb-3 border-b border-slate-100">
                    <h2 id="formTitle" class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="user-plus" class="w-5 h-5 text-indigo-600"></i> New Induction Entry
                    </h2>
                    <button type="button" id="resetFormBtn" onclick="resetForm()" class="hidden text-xs text-rose-600 hover:underline font-medium">Cancel Edit</button>
                </div>

                <form id="inductionForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <input type="hidden" id="editId">

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Serial No *</label>
                            <input type="text" id="serialNo" required readonly class="w-full px-3 py-2 text-sm bg-slate-100 border border-slate-200 rounded-lg text-slate-600 font-bold cursor-not-allowed" placeholder="Auto">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Date of Induction *</label>
                            <input type="date" id="inductionDate" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name *</label>
                        <input type="text" id="name" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all" placeholder="Worker full name">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Father's Name *</label>
                        <input type="text" id="fatherName" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all" placeholder="Father's name">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Designation *</label>
                            <input type="text" id="designation" list="designationList" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all" placeholder="e.g. Welder">
                            <datalist id="designationList">
                                <option value="Safety Officer"></option>
                                <option value="Welder"></option>
                                <option value="Electrician"></option>
                                <option value="Fitter"></option>
                                <option value="Helper"></option>
                                <option value="Supervisor"></option>
                            </datalist>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Agency / Contractor *</label>
                            <input type="text" id="agency" list="agencySuggestions" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all" placeholder="Agency name">
                            <datalist id="agencySuggestions"></datalist>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Date of Birth *</label>
                            <input type="text" id="dob" required onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" onchange="calculateAge()" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all" placeholder="Type or pick DOB">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Calculated Age</label>
                            <input type="text" id="age" readonly class="w-full px-3 py-2 text-sm bg-slate-100 border border-slate-200 rounded-lg text-slate-500 font-semibold cursor-not-allowed" placeholder="Auto-filled">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Aadhaar Card Number *</label>
                        <input type="text" id="aadhaar" required maxlength="14" placeholder="1234 5678 9012" oninput="formatAadhaar(this)" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number *</label>
                            <input type="tel" id="phone" required maxlength="10" placeholder="10-digit number" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Emergency Contact *</label>
                            <input type="tel" id="emergency" required maxlength="10" placeholder="Emergency number" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-semibold text-slate-600">Permanent Address *</label>
                            <div class="flex items-center gap-1">
                                <input type="text" id="permPincode" maxlength="6" oninput="handlePincodeInput(this.value, 'permanentAddress', 'permLastFetched')" placeholder="PIN Code" class="w-20 px-2 py-0.5 text-[11px] bg-slate-100 border border-slate-300 rounded focus:bg-white outline-none font-mono" title="Type 6-digit PIN code">
                                <input type="hidden" id="permLastFetched" value="">
                            </div>
                        </div>
                        <input type="text" id="permanentAddress" list="addressSuggestions" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all" placeholder="Type street, landmark or enter PIN...">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-semibold text-slate-600">Present Address *</label>
                            <div class="flex items-center gap-2">
                                <input type="text" id="presPincode" maxlength="6" oninput="handlePincodeInput(this.value, 'presentAddress', 'presLastFetched')" placeholder="PIN Code" class="w-20 px-2 py-0.5 text-[11px] bg-slate-100 border border-slate-300 rounded focus:bg-white outline-none font-mono" title="Type 6-digit PIN code">
                                <input type="hidden" id="presLastFetched" value="">
                                <label class="text-[11px] text-indigo-600 font-medium cursor-pointer flex items-center gap-1">
                                    <input type="checkbox" id="sameAddress" onclick="copyAddress()" class="rounded text-indigo-600 focus:ring-indigo-500 w-3 h-3"> Same as Permanent
                                </label>
                            </div>
                        </div>
                        <input type="text" id="presentAddress" list="addressSuggestions" required class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all" placeholder="Type street, landmark or enter PIN...">
                    </div>

                    <!-- Autocomplete suggestion datalists -->
                    <datalist id="addressSuggestions"></datalist>

                    <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition-all shadow-md shadow-indigo-100 flex items-center justify-center gap-2">
                        <i data-lucide="user-check" class="w-4 h-4"></i> Save Induction Record
                    </button>
                </form>
            </div>

            <!-- Table & Search Column -->
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3">
                    <div class="relative w-full sm:w-80">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search worker name, Aadhaar, agency..." class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                    </div>
                    <div class="text-xs font-medium text-slate-500">
                        Showing <span id="recordCount">0</span> records
                    </div>
                </div>

                <!-- Table Container -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto max-h-[600px]" id="tableContainer">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-slate-100 text-slate-600 uppercase font-semibold sticky top-0 z-10 border-b border-slate-200">
                                <tr>
                                    <th class="p-3">Sl No</th>
                                    <th class="p-3">Induction Date</th>
                                    <th class="p-3">Worker Details</th>
                                    <th class="p-3">Designation / Agency</th>
                                    <th class="p-3">Age / DOB</th>
                                    <th class="p-3">Aadhaar & Contact</th>
                                    <th class="p-3 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="workerTableBody" class="divide-y divide-slate-100">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm">
        <span id="toastIcon"></span>
        <span id="toastMessage"></span>
    </div>

    <!-- Firebase & App Logic Script -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIkudKei-g_EB7rSKOx3ry07ow6sz6NUQ",
            authDomain: "workerinduction-bf56c.firebaseapp.com",
            projectId: "workerinduction-bf56c",
            storageBucket: "workerinduction-bf56c.firebasestorage.app",
            messagingSenderId: "61210722711",
            appId: "1:61210722711:web:58d2f0987dab41696984d2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let workers = [];

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('inductionDate').valueAsDate = new Date();
            lucide.createIcons();
            
            db.collection("workers").orderBy("serialNo", "asc").onSnapshot((snapshot) => {
                workers = [];
                snapshot.forEach((doc) => {
                    workers.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
                updateStats();
                updateSuggestions();
                setAutoSerialNo();
            }, (error) => {
                console.error("Firestore Error: ", error);
                showToast("Cloud sync connection error.", "error");
            });
        });

        function updateSuggestions() {
            const allAddresses = [...new Set([
                ...workers.map(w => w.permanentAddress),
                ...workers.map(w => w.presentAddress)
            ])].filter(Boolean);
            document.getElementById('addressSuggestions').innerHTML = allAddresses.map(addr => `<option value="${addr}">`).join('');

            const allAgencies = [...new Set(workers.map(w => w.agency ? w.agency.trim() : ''))].filter(Boolean);
            document.getElementById('agencySuggestions').innerHTML = allAgencies.map(ag => `<option value="${ag}">`).join('');
        }

        async function handlePincodeInput(pincode, targetFieldId, lastFetchedId) {
            const inputField = document.getElementById(targetFieldId);
            const lastFetchedInput = document.getElementById(lastFetchedId);
            let currentVal = inputField.value.trim();

            if (lastFetchedInput.value && !pincode.startsWith(lastFetchedInput.value.substring(0, 3))) {
                currentVal = currentVal.replace(new RegExp(',?\\s*' + lastFetchedInput.value.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '$'), '').trim();
                lastFetchedInput.value = '';
                inputField.value = currentVal;
            }

            if (pincode.length !== 6) return;

            try {
                const response = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
                const data = await response.json();
                if (data[0].Status === "Success") {
                    const postOffice = data[0].PostOffice[0];
                    const area = postOffice.Name;
                    const district = postOffice.District;
                    const state = postOffice.State;
                    const fetchedString = `${area}, ${district}, ${state} - ${pincode}`;
                    
                    if (lastFetchedInput.value) {
                        currentVal = currentVal.replace(new RegExp(',?\\s*' + lastFetchedInput.value.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '$'), '').trim();
                    }

                    lastFetchedInput.value = fetchedString;

                    if (currentVal) {
                        inputField.value = `${currentVal}, ${fetchedString}`;
                    } else {
                        inputField.value = fetchedString;
                    }
                    showToast("PIN code area loaded!");
                } else {
                    showToast("Invalid PIN code", "error");
                }
            } catch (error) {
                console.error("PIN lookup error:", error);
            }
        }

        function setAutoSerialNo() {
            if (document.getElementById('editId').value) return;
            let nextNum = 1;
            if (workers.length > 0) {
                const nums = workers.map(w => parseInt(w.serialNo)).filter(n => !isNaN(n));
                if (nums.length > 0) {
                    nextNum = Math.max(...nums) + 1;
                } else {
                    nextNum = workers.length + 1;
                }
            }
            document.getElementById('serialNo').value = String(nextNum).padStart(3, '0');
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMessage').innerText = message;
            icon.innerHTML = type === 'success' ? '<i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>' : '<i data-lucide="alert-circle" class="w-5 h-5 text-rose-400"></i>';
            lucide.createIcons();
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }

        function formatAadhaar(input) {
            let val = input.value.replace(/\D/g, '').substring(0, 12);
            let formatted = val.match(/.{1,4}/g)?.join(' ') || val;
            input.value = formatted;
        }

        function calculateAge() {
            const dobVal = document.getElementById('dob').value;
            if (!dobVal) { document.getElementById('age').value = ''; return; }
            const dobDate = new Date(dobVal);
            const today = new Date();
            let age = today.getFullYear() - dobDate.getFullYear();
            const m = today.getMonth() - dobDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dobDate.getDate())) { age--; }
            document.getElementById('age').value = age >= 0 ? age + ' Years' : '0 Years';
        }

        function copyAddress() {
            const isChecked = document.getElementById('sameAddress').checked;
            if (isChecked) {
                document.getElementById('presentAddress').value = document.getElementById('permanentAddress').value;
                document.getElementById('presPincode').value = document.getElementById('permPincode').value;
                document.getElementById('presLastFetched').value = document.getElementById('permLastFetched').value;
            } else {
                document.getElementById('presentAddress').value = '';
                document.getElementById('presPincode').value = '';
                document.getElementById('presLastFetched').value = '';
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();

            const serialNo = document.getElementById('serialNo').value.trim();
            const aadhaar = document.getElementById('aadhaar').value.trim();
            const editId = document.getElementById('editId').value;

            const duplicate = workers.find(w => w.id !== editId && w.aadhaar === aadhaar);
            if (duplicate) {
                showToast(`Aadhaar already registered! Matches Sl No: ${duplicate.serialNo} (${duplicate.name})`, "error");
                return;
            }

            const workerData = {
                serialNo: serialNo,
                name: document.getElementById('name').value.trim(),
                fatherName: document.getElementById('fatherName').value.trim(),
                designation: document.getElementById('designation').value.trim(),
                agency: document.getElementById('agency').value.trim(),
                dob: document.getElementById('dob').value,
                age: document.getElementById('age').value,
                aadhaar: aadhaar,
                phone: document.getElementById('phone').value.trim(),
                emergency: document.getElementById('emergency').value.trim(),
                permanentAddress: document.getElementById('permanentAddress').value.trim(),
                presentAddress: document.getElementById('presentAddress').value.trim(),
                inductionDate: document.getElementById('inductionDate').value,
                updatedAt: new Date().toISOString()
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Saving to Cloud...';
            lucide.createIcons();

            try {
                if (editId) {
                    await db.collection("workers").doc(editId).update(workerData);
                    showToast("Worker updated in cloud successfully!");
                } else {
                    await db.collection("workers").add(workerData);
                    showToast("Worker saved to cloud successfully!");
                }
                resetForm();
            } catch (error) {
                console.error("Error saving document: ", error);
                showToast("Error saving to cloud database.", "error");
            } finally {
                submitBtn.innerHTML = '<i data-lucide="user-check" class="w-4 h-4"></i> Save Induction Record';
                lucide.createIcons();
            }
        }

        function resetForm() {
            document.getElementById('inductionForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('permLastFetched').value = '';
            document.getElementById('presLastFetched').value = '';
            document.getElementById('inductionDate').valueAsDate = new Date();
            document.getElementById('formTitle').innerHTML = '<i data-lucide="user-plus" class="w-5 h-5 text-indigo-600"></i> New Induction Entry';
            document.getElementById('resetFormBtn').classList.add('hidden');
            document.getElementById('submitBtn').innerHTML = '<i data-lucide="user-check" class="w-4 h-4"></i> Save Induction Record';
            setAutoSerialNo();
            lucide.createIcons();
        }

        function updateStats() {
            document.getElementById('statTotalWorkers').innerText = workers.length;
            
            const normalizedAgenciesMap = {};
            workers.forEach(w => {
                if (!w.agency) return;
                const cleanName = w.agency.trim();
                const lowerKey = cleanName.toLowerCase();
                if (!normalizedAgenciesMap[lowerKey]) {
                    normalizedAgenciesMap[lowerKey] = cleanName;
                }
            });

            const uniqueAgencies = Object.values(normalizedAgenciesMap);
            document.getElementById('statTotalAgencies').innerText = uniqueAgencies.length;

            const breakdownList = document.getElementById('agencyBreakdownList');
            if (uniqueAgencies.length === 0) {
                breakdownList.innerHTML = '<span class="text-sm text-slate-400 italic">No workers registered yet.</span>';
                return;
            }

            breakdownList.innerHTML = '';
            uniqueAgencies.forEach(agencyName => {
                const count = workers.filter(w => w.agency && w.agency.trim().toLowerCase() === agencyName.toLowerCase()).length;
                const badge = document.createElement('div');
                badge.className = 'bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-700 flex items-center gap-2';
                badge.innerHTML = `<span>${agencyName}</span> <span class="bg-indigo-600 text-white px-2 py-0.5 rounded-full text-[10px]">${count}</span>`;
                breakdownList.appendChild(badge);
            });
        }

        function renderTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const tbody = document.getElementById('workerTableBody');
            tbody.innerHTML = '';

            const filtered = workers.filter(w => {
                const name = (w.name || '').toLowerCase();
                const agency = (w.agency || '').toLowerCase();
                const designation = (w.designation || '').toLowerCase();
                const aadhaar = (w.aadhaar || '').toLowerCase();
                const phone = (w.phone || '').toLowerCase();
                return name.includes(query) || agency.includes(query) || designation.includes(query) || aadhaar.includes(query) || phone.includes(query);
            });

            document.getElementById('recordCount').innerText = filtered.length;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400 italic">No worker records found.</td></tr>`;
                return;
            }

            filtered.forEach((w) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/80 transition-all border-b border-slate-100';
                tr.innerHTML = `
                    <td class="p-3 font-semibold text-indigo-600">${w.serialNo || '-'}</td>
                    <td class="p-3 text-slate-600">${w.inductionDate || '-'}</td>
                    <td class="p-3">
                        <p class="font-bold text-slate-800">${w.name || '-'}</p>
                        <p class="text-[11px] text-slate-400">S/o: ${w.fatherName || '-'}</p>
                    </td>
                    <td class="p-3">
                        <p class="font-semibold text-slate-700">${w.designation || '-'}</p>
                        <p class="text-[11px] text-indigo-600 font-medium">${w.agency || '-'}</p>
                    </td>
                    <td class="p-3">
                        <p class="font-semibold text-slate-800">${w.age || '-'}</p>
                        <p class="text-[11px] text-slate-400">DOB: ${w.dob || '-'}</p>
                    </td>
                    <td class="p-3">
                        <p class="font-mono text-slate-700">${w.aadhaar || '-'}</p>
                        <p class="text-[11px] text-slate-500">Ph: ${w.phone || '-'}</p>
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="editWorker('${w.id}')" class="p-1.5 bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 rounded-lg transition-all" title="Edit">
                            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        function editWorker(id) {
            const w = workers.find(item => item.id === id);
            if (!w) return;

            document.getElementById('editId').value = w.id;
            document.getElementById('serialNo').value = w.serialNo || '';
            document.getElementById('inductionDate').value = w.inductionDate || '';
            document.getElementById('name').value = w.name || '';
            document.getElementById('fatherName').value = w.fatherName || '';
            document.getElementById('designation').value = w.designation || '';
            document.getElementById('agency').value = w.agency || '';
            document.getElementById('dob').value = w.dob || '';
            document.getElementById('age').value = w.age || '';
            document.getElementById('aadhaar').value = w.aadhaar || '';
            document.getElementById('phone').value = w.phone || '';
            document.getElementById('emergency').value = w.emergency || '';
            document.getElementById('permanentAddress').value = w.permanentAddress || '';
            document.getElementById('presentAddress').value = w.presentAddress || '';

            document.getElementById('formTitle').innerHTML = '<i data-lucide="user-pen" class="w-5 h-5 text-indigo-600"></i> Edit Worker Record';
            document.getElementById('resetFormBtn').classList.add('hidden');
            document.getElementById('submitBtn').innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Update Worker Record';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            lucide.createIcons();
        }

        function exportToExcel() {
            if (workers.length === 0) {
                showToast("No records available to export", "error");
                return;
            }

            const exportData = workers.map(w => ({
                "Serial No": w.serialNo,
                "Induction Date": w.inductionDate,
                "Worker Name": w.name,
                "Father's Name": w.fatherName,
                "Designation": w.designation,
                "Agency": w.agency,
                "Date of Birth": w.dob,
                "Age": w.age,
                "Aadhaar Number": w.aadhaar,
                "Phone Number": w.phone,
                "Emergency Contact": w.emergency,
                "Permanent Address": w.permanentAddress,
                "Present Address": w.presentAddress
            }));

            const worksheet = XLSX.utils.json_to_sheet(exportData);

            // Auto-fit column widths so all text is fully visible without being clipped
            const colWidths = [];
            exportData.forEach(row => {
                Object.keys(row).forEach((key, i) => {
                    const val = String(row[key] || '');
                    const len = Math.max(val.length, key.length);
                    colWidths[i] = Math.max(colWidths[i] || 10, len + 3);
                });
            });
            worksheet['!cols'] = colWidths.map(w => ({ wch: Math.min(w, 45) })); // Max cap width to look clean

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Worker Inductions");
            XLSX.writeFile(workbook, "Worker_Induction_Register.xlsx");
            showToast("Excel file downloaded successfully!");
        }
    </script>
</body>
</html>
